<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>GathSession - Build your best community starting from here</title>
  <meta name="description" content="Meet and communicate with the best people to run projects, events or other activities in a more effective and fun way. Start building your community today.">
  <meta name="keywords" content="GathSession, community, connect, projects, events, collaboration, coworking">
  <meta name="author" content="GathSession Inc.">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="GathSession - Build your best community starting from here">
  <meta property="og:description" content="Meet and communicate with the best people to run projects, events or other activities in a more effective and fun way.">
  <meta property="og:image" content="images/mockup.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="GathSession - Build your best community starting from here">
  <meta property="twitter:description" content="Meet and communicate with the best people to run projects, events or other activities in a more effective and fun way.">
  <meta property="twitter:image" content="images/mockup.png">

  <!-- Favicon -->
  <link rel="icon" href="images/logo_dot.png" type="image/png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=7">
  <style>
    .main-header,
    .hero-section {
      padding-right: 1rem !important;
    }
  </style>
</head>
<body>

  <!-- Main Container for App -->
  <div class="app-wrapper">

    <!-- Header Navigation -->
    <header class="main-header" id="header">
      <div class="header-container">
        
        <!-- Logo Composition -->
        <a href="#" class="logo-wrapper" id="site-logo" aria-label="GathSession Home">
          <img src="images/logo_gath.png" alt="Gath" class="logo-gath-part">
        </a>

        <!-- Navigation Links -->
        <nav class="navigation-menu" id="nav-menu">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" class="nav-link active" id="nav-home">Home</a>
              <img src="images/nav_line.png" alt="" class="nav-active-line" id="nav-line-indicator">
            </li>
            <li class="nav-item"><a href="#" class="nav-link" id="nav-features">Features</a></li>
            <li class="nav-item"><a href="#" class="nav-link" id="nav-blog">Blog</a></li>
            <li class="nav-item"><a href="#" class="nav-link" id="nav-contact">Contact</a></li>
            <li class="nav-item"><a href="#" class="nav-link" id="nav-about">About Us</a></li>
          </ul>
        </nav>

      </div>
    </header>

    <!-- Main Content Section -->
    <main class="main-content" id="main-content">
      
      <!-- Hero Section -->
      <section class="hero-section" id="hero">
        <div class="hero-container">

          <!-- Left: Hero Headline & Action Area -->
          <div class="hero-info-column">
            
            <h1 class="hero-title" id="main-headline">
              Build your best<br>community<br>starting from here.
            </h1>
            
            <p class="hero-subtitle" id="main-subheadline">
              Meet and communicate with the best people to run<br>projects, events or other activities in a more effective<br>and fun way
            </p>

            <div class="hero-action-buttons">
              <button id="btn-get-started" class="btn-primary" aria-label="Get Started with GathSession">
                Get Started
              </button>
              <a href="#" id="link-learn-more" class="btn-link" aria-label="Learn more about our platform">
                Learn More 
                <svg class="link-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 8H15M15 8L8 1M15 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </a>
            </div>

            <!-- Lower Level Features List -->
            <div class="features-row-container" id="features-highlights">
              
              <!-- Feature 1: Build Community -->
              <div class="feature-card-item">
                <div class="feature-icon-wrapper" aria-hidden="true">
                  <img src="images/icon_community.svg" class="feature-icon-img" alt="Build Community">
                </div>
                <div class="feature-text-wrapper">
                  <span class="feature-label">Build<br>Community</span>
                </div>
              </div>

              <!-- Feature 2: Share Events -->
              <div class="feature-card-item">
                <div class="feature-icon-wrapper" aria-hidden="true">
                  <img src="images/icon_events.svg" class="feature-icon-img" alt="Share Events">
                </div>
                <div class="feature-text-wrapper">
                  <span class="feature-label">Share<br>Events</span>
                </div>
              </div>

              <!-- Feature 3: Get Information -->
              <div class="feature-card-item">
                <div class="feature-icon-wrapper" aria-hidden="true">
                  <img src="images/icon_info.svg" class="feature-icon-img" alt="Get Information">
                </div>
                <div class="feature-text-wrapper">
                  <span class="feature-label">Get<br>Information</span>
                </div>
              </div>

            </div>

          </div>

          <!-- Right: Interactive Portraits Composition -->
          <div class="hero-visual-column" id="visual-collage">
            
            <!-- Curved Concentric Background Line Overlays -->
            <div class="collage-curves-overlay" aria-hidden="true">
              <img src="images/curve1.png" alt="" class="bg-curve-line curve-one">
              <img src="images/curve2.png" alt="" class="bg-curve-line curve-two">
            </div>

            <!-- Mosaico de Retratos Posicionados -->
            <div class="portraits-collage-grid">

              <!-- Portrait 1: Beanie Man (Capsule, Left-Top) -->
              <div class="portrait-capsule portrait-beanie" id="portrait-1">
                <div class="portrait-inner">
                  <img src="images/beanie_man.png" alt="Integrante de GathSession - Co-working" class="portrait-img">
                </div>
              </div>

              <!-- Portrait 2: Asian Woman (Circle, Top-Middle) -->
              <div class="portrait-circle portrait-asian" id="portrait-2">
                <div class="portrait-inner">
                  <img src="images/asian_woman.png" alt="Integrante de GathSession - Hackathon" class="portrait-img">
                </div>
              </div>

              <!-- Portrait 3: Redhead Woman (Circle, Bottom-Left) -->
              <div class="portrait-circle portrait-redhead" id="portrait-3">
                <div class="portrait-inner">
                  <img src="images/redhead_woman.png" alt="Integrante de GathSession - Social Sessions" class="portrait-img">
                </div>
              </div>

              <!-- Portrait 4: Smiling Man (Capsule, Middle-Right) -->
              <div class="portrait-capsule portrait-smiling" id="portrait-4">
                <div class="portrait-inner">
                  <img src="images/smiling_man.png" alt="Integrante de GathSession - Community Events" class="portrait-img">
                </div>
              </div>

              <!-- Portrait 5: Turban Woman (Capsule, Far-Right) -->
              <div class="portrait-capsule portrait-turban" id="portrait-5">
                <div class="portrait-inner">
                  <img src="images/turban_woman.png" alt="Integrante de GathSession - Masterclasses" class="portrait-img">
                </div>
              </div>

            </div>

          </div>

        </div>
      </section>

    </main>

  </div>

  <!-- JavaScript Modules -->
  <script type="module" src="main.js"></script>
</body>
</html>
